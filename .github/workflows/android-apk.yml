name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app.py'
      - 'buildozer.spec'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev libffi-dev libssl-dev cmake libltdl-dev

      - name: Install Buildozer
        run: pip install --upgrade pip buildozer==1.5.0

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-daily-assistant-debug-apk
          path: bin/*.apk
          if-no-files-found: error
